<svg width="1024" height="768" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <rect width="1024" height="768" fill="#ffffff" />
  <!-- Browser window frame -->
  <rect x="10" y="10" width="1004" height="748" fill="none" stroke="#333333" stroke-width="2" />
  <line x1="10" y1="50" x2="1014" y2="50" stroke="#333333" stroke-width="2" />
  <circle cx="30" cy="30" r="5" fill="#cccccc" />
  <circle cx="50" cy="30" r="5" fill="#cccccc" />
  <circle cx="70" cy="30" r="5" fill="#cccccc" />
  
  <!-- Sidebar -->
  <rect x="10" y="50" width="220" height="708" fill="#f8f9fa" stroke="#333333" stroke-width="1" />
  <text x="40" y="90" font-family="sans-serif" font-weight="bold" font-size="20" fill="#333">MenTaLink</text>
  <line x1="10" y1="110" x2="230" y2="110" stroke="#cccccc" stroke-width="1" />
  
  <rect x="20" y="130" width="180" height="30" fill="#e9ecef" rx="4" />
  <text x="40" y="150" font-family="sans-serif" font-size="14" fill="#000">Dashboard</text>
  <text x="40" y="190" font-family="sans-serif" font-size="14" fill="#555">Estudiantes</text>
  <text x="40" y="230" font-family="sans-serif" font-size="14" fill="#555">Reportes</text>
  <text x="40" y="270" font-family="sans-serif" font-size="14" fill="#555">Ajustes</text>

  <!-- Main Content Header -->
  <text x="260" y="90" font-family="sans-serif" font-weight="bold" font-size="24" fill="#333">Panel General</text>
  <rect x="850" y="70" width="140" height="30" fill="#ffffff" stroke="#cccccc" rx="15" />
  <text x="890" y="90" font-family="sans-serif" font-size="12" fill="#555">Buscar...</text>
  
  <!-- KPI Cards -->
  <rect x="260" y="120" width="220" height="100" fill="#ffffff" stroke="#cccccc" rx="8" />
  <text x="280" y="150" font-family="sans-serif" font-size="14" fill="#777">Total Pacientes</text>
  <text x="280" y="190" font-family="sans-serif" font-weight="bold" font-size="32" fill="#333">142</text>
  
  <rect x="500" y="120" width="220" height="100" fill="#ffffff" stroke="#cccccc" rx="8" />
  <text x="520" y="150" font-family="sans-serif" font-size="14" fill="#777">Alertas Activas</text>
  <text x="520" y="190" font-family="sans-serif" font-weight="bold" font-size="32" fill="#d9534f">8</text>

  <rect x="740" y="120" width="220" height="100" fill="#ffffff" stroke="#cccccc" rx="8" />
  <text x="760" y="150" font-family="sans-serif" font-size="14" fill="#777">Casos de Alto Riesgo</text>
  <text x="760" y="190" font-family="sans-serif" font-weight="bold" font-size="32" fill="#f0ad4e">15</text>

  <!-- Table Area -->
  <rect x="260" y="250" width="700" height="280" fill="#ffffff" stroke="#cccccc" rx="8" />
  <rect x="260" y="250" width="700" height="40" fill="#f8f9fa" stroke="#cccccc" />
  <text x="280" y="275" font-family="sans-serif" font-weight="bold" font-size="14" fill="#555">Nombre del Estudiante</text>
  <text x="500" y="275" font-family="sans-serif" font-weight="bold" font-size="14" fill="#555">Riesgo (ARI)</text>
  <text x="650" y="275" font-family="sans-serif" font-weight="bold" font-size="14" fill="#555">Último Diario</text>
  <text x="820" y="275" font-family="sans-serif" font-weight="bold" font-size="14" fill="#555">Acción</text>

  <!-- Row 1 -->
  <text x="280" y="320" font-family="sans-serif" font-size="14" fill="#333">Benjamin Hayes</text>
  <rect x="500" y="305" width="60" height="22" fill="#f2dede" stroke="#ebccd1" rx="4" />
  <text x="515" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a94442">ALTO</text>
  <text x="650" y="320" font-family="sans-serif" font-size="14" fill="#555">Hace 2 hrs</text>
  <rect x="820" y="305" width="80" height="24" fill="#ffffff" stroke="#cccccc" rx="4" />
  <text x="835" y="322" font-family="sans-serif" font-size="12" fill="#333">Ver Perfil</text>
  <line x1="260" y1="340" x2="960" y2="340" stroke="#eeeeee" stroke-width="1" />

  <!-- Row 2 -->
  <text x="280" y="370" font-family="sans-serif" font-size="14" fill="#333">Emily Chen</text>
  <rect x="500" y="355" width="60" height="22" fill="#fcf8e3" stroke="#faebcc" rx="4" />
  <text x="510" y="370" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8a6d3b">MEDIO</text>
  <text x="650" y="370" font-family="sans-serif" font-size="14" fill="#555">Ayer</text>
  <rect x="820" y="355" width="80" height="24" fill="#ffffff" stroke="#cccccc" rx="4" />
  <text x="835" y="372" font-family="sans-serif" font-size="12" fill="#333">Ver Perfil</text>
  <line x1="260" y1="390" x2="960" y2="390" stroke="#eeeeee" stroke-width="1" />

  <!-- Row 3 -->
  <text x="280" y="420" font-family="sans-serif" font-size="14" fill="#333">Ryan Garcia</text>
  <rect x="500" y="405" width="60" height="22" fill="#dff0d8" stroke="#d6e9c6" rx="4" />
  <text x="515" y="420" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3c763d">BAJO</text>
  <text x="650" y="420" font-family="sans-serif" font-size="14" fill="#555">Hace 3 días</text>
  <rect x="820" y="405" width="80" height="24" fill="#ffffff" stroke="#cccccc" rx="4" />
  <text x="835" y="422" font-family="sans-serif" font-size="12" fill="#333">Ver Perfil</text>
  <line x1="260" y1="440" x2="960" y2="440" stroke="#eeeeee" stroke-width="1" />

  <!-- Graph placeholder -->
  <rect x="260" y="560" width="700" height="170" fill="#ffffff" stroke="#cccccc" rx="8" />
  <text x="280" y="590" font-family="sans-serif" font-weight="bold" font-size="16" fill="#333">Tendencia Emocional Semanal</text>
  
  <line x1="300" y1="700" x2="920" y2="700" stroke="#cccccc" stroke-width="1" />
  <line x1="300" y1="620" x2="300" y2="700" stroke="#cccccc" stroke-width="1" />
  
  <polyline points="300,680 400,640 500,660 600,610 700,650 800,590 900,630" fill="none" stroke="#5bc0de" stroke-width="3" />
  <circle cx="300" cy="680" r="4" fill="#5bc0de" />
  <circle cx="400" cy="640" r="4" fill="#5bc0de" />
  <circle cx="500" cy="660" r="4" fill="#5bc0de" />
  <circle cx="600" cy="610" r="4" fill="#5bc0de" />
  <circle cx="700" cy="650" r="4" fill="#5bc0de" />
  <circle cx="800" cy="590" r="4" fill="#5bc0de" />
  <circle cx="900" cy="630" r="4" fill="#5bc0de" />
</svg>
