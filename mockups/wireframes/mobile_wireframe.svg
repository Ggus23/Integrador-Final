<svg width="414" height="896" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <rect width="414" height="896" fill="#ffffff" />
  
  <!-- Phone Frame -->
  <rect x="20" y="20" width="374" height="856" rx="40" ry="40" fill="#ffffff" stroke="#333333" stroke-width="8" />
  <rect x="157" y="20" width="100" height="25" rx="10" ry="10" fill="#333333" /> <!-- Notch -->

  <!-- Header -->
  <text x="40" y="90" font-family="sans-serif" font-weight="bold" font-size="22" fill="#333">MenTaLink</text>
  <circle cx="360" cy="83" r="16" fill="#eeeeee" />
  <circle cx="360" cy="80" r="6" fill="#999999" />
  <path d="M 350 93 q 10 -15 20 0" stroke="#999999" stroke-width="3" fill="none" />
  
  <!-- Welcome -->
  <text x="40" y="140" font-family="sans-serif" font-weight="bold" font-size="28" fill="#111">¡Hola, Alex!</text>
  <text x="40" y="165" font-family="sans-serif" font-size="16" fill="#666">Jueves, 26 de Octubre</text>

  <!-- Mood Tracker -->
  <text x="40" y="210" font-family="sans-serif" font-weight="bold" font-size="18" fill="#333">¿Cómo te sientes hoy?</text>
  <rect x="40" y="230" width="334" height="100" rx="15" fill="#f8f9fa" stroke="#eeeeee" />
  
  <!-- Faces -->
  <circle cx="75" cy="280" r="22" fill="#ffeeba" />
  <text x="65" y="285" font-size="20">😠</text>
  <text x="60" y="320" font-family="sans-serif" font-size="12" fill="#555">Mal</text>

  <circle cx="140" cy="280" r="22" fill="#e2e3e5" />
  <text x="130" y="285" font-size="20">😕</text>
  <text x="125" y="320" font-family="sans-serif" font-size="12" fill="#555">Regular</text>

  <circle cx="205" cy="280" r="22" fill="#d1ecf1" />
  <text x="195" y="285" font-size="20">😐</text>
  <text x="190" y="320" font-family="sans-serif" font-size="12" fill="#555">Normal</text>

  <!-- Selected Mood -->
  <rect x="245" y="255" width="50" height="50" rx="25" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="260" y="285" font-size="20">🙂</text>
  <text x="255" y="320" font-family="sans-serif" font-weight="bold" font-size="12" fill="#28a745">Bien</text>

  <circle cx="335" cy="280" r="22" fill="#cce5ff" />
  <text x="325" y="285" font-size="20">🤩</text>
  <text x="320" y="320" font-family="sans-serif" font-size="12" fill="#555">Genial</text>

  <!-- Diary -->
  <text x="40" y="370" font-family="sans-serif" font-weight="bold" font-size="18" fill="#333">Mi Diario Digital</text>
  <rect x="40" y="390" width="334" height="150" rx="15" fill="#ffffff" stroke="#cccccc" />
  <text x="55" y="420" font-family="sans-serif" font-size="15" fill="#999">Escribe lo que tienes en mente...</text>
  
  <rect x="40" y="560" width="334" height="48" rx="24" fill="#007bff" />
  <text x="155" y="590" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">Guardar Nota</text>

  <!-- Interventions -->
  <text x="40" y="650" font-family="sans-serif" font-weight="bold" font-size="18" fill="#333">Recomendado para ti</text>
  
  <rect x="40" y="670" width="160" height="110" rx="15" fill="#e8f4f8" stroke="#d0e8f2" />
  <text x="55" y="700" font-size="24">🫁</text>
  <text x="55" y="735" font-family="sans-serif" font-weight="bold" font-size="14" fill="#333">Respiración</text>
  <text x="55" y="755" font-family="sans-serif" font-size="12" fill="#666">Ejercicio de 5 min</text>

  <rect x="214" y="670" width="160" height="110" rx="15" fill="#f4ebf8" stroke="#e8d0f2" />
  <text x="229" y="700" font-size="24">🧘</text>
  <text x="229" y="735" font-family="sans-serif" font-weight="bold" font-size="14" fill="#333">Pausa Activa</text>
  <text x="229" y="755" font-family="sans-serif" font-size="12" fill="#666">Estiramiento guiado</text>

  <!-- Bottom Nav -->
  <path d="M 20 800 L 394 800" stroke="#eeeeee" stroke-width="2" />
  <rect x="20" y="800" width="374" height="76" rx="40" fill="#ffffff" />
  
  <text x="55" y="830" font-size="22">🏠</text>
  <text x="55" y="850" font-family="sans-serif" font-size="10" font-weight="bold" fill="#007bff">Inicio</text>
  
  <text x="145" y="830" font-size="22" opacity="0.5">📓</text>
  <text x="145" y="850" font-family="sans-serif" font-size="10" fill="#999">Diario</text>
  
  <text x="235" y="830" font-size="22" opacity="0.5">📊</text>
  <text x="235" y="850" font-family="sans-serif" font-size="10" fill="#999">Avance</text>
  
  <text x="325" y="830" font-size="22" opacity="0.5">👤</text>
  <text x="325" y="850" font-family="sans-serif" font-size="10" fill="#999">Perfil</text>

  <rect x="157" y="865" width="100" height="4" rx="2" fill="#cccccc" />
</svg>
