[pytest]
python_functions = prueba_*
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib\.utils
    ignore:Accessing argon2\.__version__ is deprecated and will be removed in a future release.*:DeprecationWarning:passlib\.handlers\.argon2
    # 1. Ignora la deprecación de pkg_resources (APScheduler)
    ignore::DeprecationWarning:pkg_resources.*
    
    # 2. Ignora la deprecación de datetime.utcnow() dentro de la librería python-jose
    ignore::DeprecationWarning:jose\.jwt.*
    
    # 3. Ignora el warning de detección de núcleos en joblib/loky
    ignore::UserWarning:joblib\.externals\.loky.*
    # Filtrar por el mensaje de pkg_resources
    ignore:pkg_resources is deprecated as an API:DeprecationWarning
    # O filtrar cualquier DeprecationWarning que venga de apscheduler
    ignore::DeprecationWarning:apscheduler.*